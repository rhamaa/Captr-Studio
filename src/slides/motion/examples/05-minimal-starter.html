<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Starter — Captr Motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       1. BASE STYLES & RESET
       ========================================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================================
       2. CANVAS LAYOUT
       ========================================================================= */
    .motion-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #090d16 100%);
    }

    /* =========================================================================
       3. ANIMATED OBJECTS
       ========================================================================= */
    .hero-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 60px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .icon-badge {
      font-size: 32px;
      margin-bottom: 16px;
    }

    .heading {
      font-size: 40px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subheading {
      font-size: 16px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="motion-viewport">
    <div class="hero-box" id="hero-box">
      <div class="icon-badge">✨</div>
      <h1 class="heading">Minimal Starter</h1>
      <p class="subheading">Your blank canvas for Captr Studio motion graphics</p>
    </div>
  </div>

  <script>
    // =========================================================================
    // 4. TIMELINE CONTROLLER HOOK (CAPTR STUDIO CONTRACT)
    // =========================================================================
    // Captr Studio automatically calls window.setSeekTime(timeMs, durationMs)
    // whenever the playhead moves, scrubs, or during headless MP4 export.
    
    window.setSeekTime = function(timeMs, durationMs) {
      // Normalized progress between 0.0 (start) and 1.0 (end)
      const progress = Math.min(1, Math.max(0, timeMs / Math.max(1, durationMs)));
      
      // Example: Smooth ease-out cubic curve
      const eased = 1 - Math.pow(1 - progress, 3);

      const hero = document.getElementById("hero-box");
      if (hero) {
        // Animate scale & opacity
        hero.style.opacity = eased;
        hero.style.transform = `scale(${0.9 + eased * 0.1}) translateY(${(1 - eased) * 30}px)`;
      }
    };

    console.log("[Minimal Starter] Initialized");
  </script>
</body>
</html>
