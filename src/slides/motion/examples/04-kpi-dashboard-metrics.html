<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI Dashboard Metrics — Captr Motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #030712;
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dashboard-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 80%);
    }

    .glow-blur {
      position: absolute;
      width: 600px;
      height: 600px;
      background: #10b981;
      filter: blur(140px);
      opacity: 0.15;
      border-radius: 50%;
      pointer-events: none;
    }

    .dashboard-panel {
      position: relative;
      z-index: 10;
      max-width: 980px;
      width: 90%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-left h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-left p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 14px;
      border-radius: 9999px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    /* KPI Cards Row */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .kpi-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 24px;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 36px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .kpi-delta {
      font-size: 12px;
      font-weight: 700;
      color: #34d399;
    }

    /* Charts Row */
    .charts-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .chart-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 24px;
    }

    .chart-box h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 18px;
      color: #cbd5e1;
    }

    /* Bar chart columns */
    .bars-container {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      height: 120px;
      padding-top: 10px;
    }

    .bar-col {
      flex: 1;
      height: 0%;
      background: linear-gradient(180deg, #10b981 0%, rgba(16, 185, 129, 0.2) 100%);
      border-radius: 6px 6px 0 0;
      transition: height 0.05s linear;
    }

    /* Circular Progress */
    .radial-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .radial-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: #34d399;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="dashboard-canvas">
    <div class="glow-blur"></div>

    <div class="dashboard-panel" id="panel">
      <div class="panel-header">
        <div class="header-left">
          <h1>Monthly Performance Overview</h1>
          <p>Real-time metrics stream & growth trajectory</p>
        </div>
        <div class="live-status">
          <div class="pulse-dot"></div>
          <span>LIVE TELEMETRY</span>
        </div>
      </div>

      <div class="kpi-row">
        <div class="kpi-card">
          <div class="kpi-label">Annual Recurring Revenue</div>
          <div class="kpi-value" id="kpi-arr">$0</div>
          <div class="kpi-delta">▲ +48.2% YoY</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-label">Active Paid Subscribers</div>
          <div class="kpi-value" id="kpi-users">0</div>
          <div class="kpi-delta">▲ +3,420 this month</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-label">Gross Retention Rate</div>
          <div class="kpi-value" id="kpi-retention">0%</div>
          <div class="kpi-delta">▲ Benchmark Top 5%</div>
        </div>
      </div>

      <div class="charts-row">
        <div class="chart-box">
          <h3>Growth Velocity (Q1 - Q4)</h3>
          <div class="bars-container">
            <div class="bar-col" id="bar-1" data-target="45"></div>
            <div class="bar-col" id="bar-2" data-target="60"></div>
            <div class="bar-col" id="bar-3" data-target="80"></div>
            <div class="bar-col" id="bar-4" data-target="55"></div>
            <div class="bar-col" id="bar-5" data-target="90"></div>
            <div class="bar-col" id="bar-6" data-target="75"></div>
            <div class="bar-col" id="bar-7" data-target="100"></div>
          </div>
        </div>

        <div class="chart-box radial-center">
          <h3>System Uptime</h3>
          <svg width="90" height="90" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" stroke="rgba(255,255,255,0.08)" stroke-width="8" fill="none" />
            <circle id="radial-progress" cx="50" cy="50" r="42" stroke="#10b981" stroke-width="8" fill="none"
                    stroke-dasharray="264" stroke-dashoffset="264" stroke-linecap="round"
                    transform="rotate(-90 50 50)" />
          </svg>
          <div class="radial-text" id="radial-label">0.0%</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function lerp(start, end, t) {
      return start + (end - start) * t;
    }

    // Targets
    const TARGET_ARR = 124500;
    const TARGET_USERS = 8420;
    const TARGET_RETENTION = 98.4;
    const TARGET_UPTIME = 99.9;

    window.setSeekTime = function(timeMs, durationMs) {
      const progress = Math.min(1, Math.max(0, timeMs / Math.max(1, durationMs)));
      const eased = easeOutCubic(progress);

      // 1. Counter updates
      const arrVal = Math.round(lerp(0, TARGET_ARR, eased));
      const usersVal = Math.round(lerp(0, TARGET_USERS, eased));
      const retentionVal = lerp(0, TARGET_RETENTION, eased).toFixed(1);

      const elArr = document.getElementById("kpi-arr");
      const elUsers = document.getElementById("kpi-users");
      const elRetention = document.getElementById("kpi-retention");

      if (elArr) elArr.textContent = "$" + arrVal.toLocaleString("en-US");
      if (elUsers) elUsers.textContent = usersVal.toLocaleString("en-US");
      if (elRetention) elRetention.textContent = retentionVal + "%";

      // 2. Bar chart columns
      for (let i = 1; i <= 7; i++) {
        const bar = document.getElementById("bar-" + i);
        if (bar) {
          const target = parseFloat(bar.getAttribute("data-target") || "50");
          // Staggered rise
          const barDelay = (i - 1) * 0.08;
          const barProgress = Math.min(1, Math.max(0, (progress - barDelay) / 0.5));
          const barEased = easeOutCubic(barProgress);
          bar.style.height = (target * barEased) + "%";
        }
      }

      // 3. Radial circular gauge
      const circle = document.getElementById("radial-progress");
      const label = document.getElementById("radial-label");
      if (circle && label) {
        const totalLen = 264; // 2 * PI * 42
        const currentLen = totalLen - (totalLen * (TARGET_UPTIME / 100) * eased);
        circle.style.strokeDashoffset = currentLen.toFixed(1);
        label.textContent = (TARGET_UPTIME * eased).toFixed(1) + "%";
      }
    };

    console.log("[Dashboard Metrics] Ready for timeline seek");
  </script>
</body>
</html>
