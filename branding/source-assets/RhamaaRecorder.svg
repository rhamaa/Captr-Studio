<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Polar Night) -->
    <linearGradient id="polar-bg" x1="40" y1="30" x2="472" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B4252" />
      <stop offset="45%" stop-color="#2E3440" />
      <stop offset="100%" stop-color="#242933" />
    </linearGradient>

    <!-- Border Frost Glow -->
    <linearGradient id="frost-border" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#88C0D0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#81A1C1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#5E81AC" stop-opacity="0.65" />
    </linearGradient>

    <!-- Inner Ambient Lighting -->
    <radialGradient id="frost-ambient" cx="256" cy="120" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#88C0D0" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#81A1C1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#2E3440" stop-opacity="0" />
    </radialGradient>

    <!-- Stem & Loop Gradient (Nord Frost to Glacier) -->
    <linearGradient id="r-primary-grad" x1="130" y1="112" x2="350" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8FBCBB" />
      <stop offset="30%" stop-color="#88C0D0" />
      <stop offset="70%" stop-color="#81A1C1" />
      <stop offset="100%" stop-color="#5E81AC" />
    </linearGradient>

    <!-- Diagonal Leg Dynamic Gradient -->
    <linearGradient id="r-leg-grad" x1="240" y1="264" x2="352" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#81A1C1" />
      <stop offset="50%" stop-color="#88C0D0" />
      <stop offset="100%" stop-color="#A3BE8C" />
    </linearGradient>

    <!-- Aurora Red Record Dot Glow -->
    <radialGradient id="rec-dot-glow" cx="252" cy="198" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BF616A" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#D08770" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#BF616A" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="r-shadow" x="76" y="80" width="360" height="364" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0E131B" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#polar-bg)" stroke="url(#frost-border)" stroke-width="4.5" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#frost-ambient)" />

  <!-- Subtle Nordic Focus Brackets (Viewfinder Corners) -->
  <path d="M72 108 V72 H108" stroke="#88C0D0" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
  <path d="M440 108 V72 H404" stroke="#88C0D0" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
  <path d="M72 404 V440 H108" stroke="#88C0D0" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
  <path d="M440 404 V440 H404" stroke="#88C0D0" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />

  <!-- The "R" Emblem Group with Depth Shadow -->
  <g filter="url(#r-shadow)">
    <!-- Vertical Spine / Timeline Pillar (Left Stem) -->
    <rect x="134" y="112" width="48" height="288" rx="24" fill="url(#r-primary-grad)" />

    <!-- Diagonal Motion Kick (Lower Leg) - placed before loop so waist overlaps seamlessly -->
    <line x1="240" y1="264" x2="348" y2="384" stroke="url(#r-leg-grad)" stroke-width="48" stroke-linecap="round" />

    <!-- Upper Bowl of the R (Smooth Arch connecting to waist) -->
    <path d="M158 136 H268 C308 136 342 165 342 200 C342 235 308 264 268 264 H158" 
          fill="none" 
          stroke="url(#r-primary-grad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Aperture Recording Eye in the center of the upper bowl -->
    <circle cx="252" cy="200" r="27" fill="url(#rec-dot-glow)" />
    <circle cx="252" cy="200" r="11" fill="#BF616A" stroke="#ECEFF4" stroke-width="2" />

    <!-- Sleek Nordic Shutter Accent (Lens Flare ring) -->
    <circle cx="252" cy="200" r="21" stroke="#ECEFF4" stroke-width="1.5" stroke-dasharray="8 14" opacity="0.45" />
  </g>

  <!-- Nordic Star Sparkle Accent (Top Right) -->
  <path d="M396 92 Q396 106 382 106 Q396 106 396 120 Q396 106 410 106 Q396 106 396 92 Z" fill="#88C0D0" opacity="0.95" />
</svg>
